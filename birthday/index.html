<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050308">
<title>生日快乐！</title>
<style>
  /* ================= 基础 ================= */
  :root{
    --bg:#050308;
    --gold:#d4af6a;
    --gold-2:#f4e4c1;
    --gold-dim:rgba(212,175,106,.35);
    --gold-faint:rgba(212,175,106,.12);
    --rose:#e8b4a8;
    --lav:#b8a4d4;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-back:cubic-bezier(.34,1.4,.4,1);
    --ease-soft:cubic-bezier(.5,0,.15,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}

  body{
    font-family:var(--sans);
    background:var(--bg);
    color:#e8e2d8;
    overflow-x:hidden;
    min-height:100vh;min-height:100dvh;
    /* 桌面浏览器有竖向滚动条时，内容区比窗口窄 15px 左右，
       "内容区居中"在窗口里看会整体偏左半个滚动条宽；这里补回来 */
    padding-left:calc(100vw - 100%);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-feature-settings:"kern" 1,"liga" 1;
    touch-action:manipulation;
  }

  /* ================= 背景 ================= */
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(140% 90% at 50% -20%,
        #1a1230 0%, #0e0a1c 30%, #07040e 60%, #050308 100%);
  }
  .bg::before{
    content:'';position:absolute;
    width:80vw;height:80vw;left:-30vw;top:-10vh;
    border-radius:50%;
    background:radial-gradient(circle,rgba(184,164,212,.08),transparent 65%);
    filter:blur(70px);
    animation:bgDriftA 34s ease-in-out infinite;
  }
  .bg::after{
    content:'';position:absolute;
    width:90vw;height:90vw;right:-35vw;bottom:-20vh;
    border-radius:50%;
    background:radial-gradient(circle,rgba(212,175,106,.06),transparent 68%);
    filter:blur(80px);
    animation:bgDriftB 42s ease-in-out infinite;
  }
  @keyframes bgDriftA{
    0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:.85; }
    50%    { transform:translate3d(6vw,4vh,0) scale(1.12); opacity:1; }
  }
  @keyframes bgDriftB{
    0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:.8; }
    50%    { transform:translate3d(-5vw,-3vh,0) scale(1.1); opacity:1; }
  }

  .grain{
    position:fixed;inset:0;z-index:1;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  #fx{position:fixed;inset:0;z-index:60;pointer-events:none;}

  /* 指间柔光 */
  .aura{
    position:fixed;
    left:0;top:0;
    width:420px;height:420px;
    margin:-210px 0 0 -210px;
    z-index:59;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.8s var(--ease);
    background:radial-gradient(circle,
      rgba(212,175,106,.10) 0%,
      rgba(184,164,212,.06) 34%,
      transparent 66%);
    filter:blur(14px);
    will-change:transform;
  }
  .aura.on{opacity:1;}

  /* 唤醒闪光 */
  .flash{
    position:fixed;inset:0;
    z-index:64;
    pointer-events:none;
    opacity:0;
    background:radial-gradient(circle at var(--fx) var(--fy),
      rgba(255,246,224,.9) 0%,
      rgba(212,175,106,.35) 26%,
      rgba(184,164,212,.14) 46%,
      transparent 68%);
    transform:scale(.5);
  }
  .flash.on{animation:flashOut 1.5s var(--ease-out) forwards;}
  @keyframes flashOut{
    0%  { opacity:.95; transform:scale(.5); }
    45% { opacity:.5;  transform:scale(1.05); }
    100%{ opacity:0;   transform:scale(1.9); }
  }

  /* ================= 开场 ================= */
  .intro{
    position:fixed;inset:0;z-index:30;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:44px;
    background:radial-gradient(120% 80% at 50% 42%,rgba(26,18,48,.6),rgba(5,3,8,.97));
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    transition:opacity 1.8s var(--ease),visibility 0s 1.8s,backdrop-filter 1.8s var(--ease);
  }
  .intro.hide{opacity:0;visibility:hidden;pointer-events:none;}

  .orb-wrap{
    position:relative;
    width:120px;height:120px;
    display:grid;place-items:center;
    cursor:pointer;
    -webkit-user-select:none;user-select:none;
  }
  .orb-wrap::before{
    content:'';position:absolute;
    inset:-34px;border-radius:50%;
    background:conic-gradient(from 0deg,
      transparent 0deg,
      rgba(212,175,106,.20) 55deg,
      transparent 130deg,
      rgba(184,164,212,.16) 215deg,
      transparent 300deg,
      rgba(232,180,168,.12) 340deg,
      transparent 360deg);
    filter:blur(11px);
    animation:haloSpin 20s linear infinite;
    pointer-events:none;
    transition:opacity 1s var(--ease);
  }
  .orb-wrap::after{
    content:'';position:absolute;
    inset:-4px;border-radius:50%;
    box-shadow:0 0 70px 22px rgba(212,175,106,.10);
    animation:haloBreath 7.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes haloSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes haloBreath{
    0%,100%{ opacity:.55; transform:scale(.94); }
    50%    { opacity:1;   transform:scale(1.08); }
  }

  .orb{
    position:relative;
    width:44px;height:44px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%,
      #fff 0%, #f4e4c1 22%, #d4af6a 50%, rgba(212,175,106,.15) 80%, transparent 100%);
    box-shadow:
      0 0 30px 8px rgba(212,175,106,.35),
      0 0 70px 20px rgba(212,175,106,.12),
      inset 0 0 12px rgba(255,255,255,.5);
    animation:orbBreathe 5.4s ease-in-out infinite;
    transition:transform .9s var(--ease-out),opacity .9s var(--ease-out);
  }
  .orb::after{
    content:'';position:absolute;
    inset:-16px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,242,208,.22),transparent 62%);
    animation:haloBreath 5.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes orbBreathe{
    0%,100%{
      transform:scale(1);
      box-shadow:0 0 30px 8px rgba(212,175,106,.35),0 0 70px 20px rgba(212,175,106,.12),inset 0 0 12px rgba(255,255,255,.5);
    }
    50%{
      transform:scale(1.14);
      box-shadow:0 0 46px 16px rgba(212,175,106,.5),0 0 100px 34px rgba(212,175,106,.18),inset 0 0 18px rgba(255,255,255,.72);
    }
  }

  .orb-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(212,175,106,.18);
    animation:ringPulse 5.6s ease-out infinite;
    pointer-events:none;
  }
  .orb-ring:nth-child(2){ animation-delay:1.4s; }
  .orb-ring:nth-child(3){ animation-delay:2.8s; }
  .orb-ring:nth-child(4){ animation-delay:4.2s; }
  @keyframes ringPulse{
    0%  { transform:scale(.35);opacity:.9;border-color:rgba(212,175,106,.28); }
    60% { opacity:.35; }
    100%{ transform:scale(1.75);opacity:0;border-color:rgba(244,228,193,.06); }
  }

  /* ---------- 开场新增：旋转光芒 ---------- */
  .orb-rays{
    position:absolute;
    inset:-54px;
    border-radius:50%;
    background:repeating-conic-gradient(from 0deg,
      rgba(255,242,212,.22) 0deg 1.5deg,
      rgba(212,175,106,.07) 1.5deg 3deg,
      transparent 3deg 11deg);
    -webkit-mask-image:radial-gradient(circle,transparent 20%,#000 45%,rgba(0,0,0,.35) 68%,transparent 84%);
    mask-image:radial-gradient(circle,transparent 20%,#000 45%,rgba(0,0,0,.35) 68%,transparent 84%);
    animation:raysSpin 30s linear infinite, raysBreath 7.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes raysSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes raysBreath{
    0%,100%{ opacity:.26; }
    50%    { opacity:.85; }
  }

  /* ---------- 开场新增：环绕的星点 ---------- */
  .orb-orbit{
    position:absolute;inset:0;
    pointer-events:none;
  }
  .orb-orbit i{
    position:absolute;left:50%;top:50%;
    width:0;height:0;
    transform:translate(var(--dx,0),var(--dy,0));
    transition:opacity .6s var(--ease),transform .8s var(--ease-back);
    transition-delay:var(--xd,0s);
  }
  .orb-orbit i::after{
    content:'';
    position:absolute;left:0;top:0;
    width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
    border-radius:50%;
    background:radial-gradient(circle,#fff,rgba(212,175,106,.75) 46%,transparent 74%);
    animation:dotTwinkle 3.4s ease-in-out infinite;
    animation-delay:var(--d,0s);
  }
  .orb-orbit.dim i::after{ width:2px;height:2px;margin:-1px 0 0 -1px; }
  @keyframes dotTwinkle{
    0%,100%{ opacity:.4; box-shadow:0 0 4px rgba(212,175,106,.45); }
    50%    { opacity:1;  box-shadow:0 0 12px rgba(255,236,190,.95); }
  }
  @keyframes orbitSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .orb-wrap.tapped .orb{
    transform:scale(2.8);
    opacity:0;
    transition:transform 1.15s var(--ease-out),opacity 1.15s var(--ease-out);
  }
  .orb-wrap.tapped .orb-rays{
    animation:none;
    opacity:0;
    transform:rotate(70deg);
    transition:opacity 1s var(--ease),transform 1.4s var(--ease-out);
  }
  .orb-wrap.tapped .orb-orbit i{
    opacity:0;
    transform:translate(calc(var(--dx,0) * .18),calc(var(--dy,0) * .18)) scale(.2);
  }
  .orb-wrap.tapped::before,
  .orb-wrap.tapped::after{ opacity:0;transition:opacity .8s var(--ease); }
  .orb-wrap.tapped .orb-ring{ animation:none;opacity:0;transition:opacity .6s var(--ease); }

  .intro-text{
    font-family:var(--serif);
    font-size:12px;
    font-weight:400;
    letter-spacing:.6em;
    text-indent:.6em;
    color:rgba(244,228,193,.55);
    animation:introPulse 4.6s ease-in-out infinite;
  }
  @keyframes introPulse{
    0%,100%{ opacity:.28; letter-spacing:.6em; }
    50%    { opacity:.92; letter-spacing:.72em; }
  }

  /* ================= 主内容 ================= */
  .main{
    position:relative;z-index:2;
    opacity:0;visibility:hidden;
    transform:translateY(18px);
    transition:opacity 1.8s var(--ease),transform 1.8s var(--ease-out),visibility .1s;
  }
  .main.show{opacity:1;visibility:visible;transform:none;}

  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:0 28px calc(80px + env(safe-area-inset-bottom));
  }

  .sec-label{
    display:block;
    font-family:var(--serif);
    font-size:10px;
    font-weight:400;
    letter-spacing:.55em;
    text-indent:.55em;
    color:var(--gold-dim);
    text-align:center;
    margin-bottom:28px;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    text-align:center;
    min-height:100vh;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:calc(56px + env(safe-area-inset-top)) 0 calc(56px + env(safe-area-inset-bottom));
  }
  .hero-inner{
    position:relative;
    width:100%;
  }

  .hero h1{
    font-family:var(--serif);
    font-size:clamp(44px,13.6vw,76px);
    font-weight:500;
    letter-spacing:.18em;
    text-indent:.18em;
    line-height:1.15;
    white-space:nowrap;
    background:linear-gradient(100deg,
      #ffffff 0%, #f4e4c1 26%, #fff7e2 38%, #f4e4c1 50%, #d4af6a 76%, #a88a4e 100%);
    background-size:240% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 6px 30px rgba(212,175,106,.3));
    user-select:none;-webkit-user-select:none;
    cursor:pointer;
    transition:transform .5s var(--ease);
    animation:heroSheen 13s var(--ease-soft) infinite,
              heroGlow 7.5s ease-in-out infinite;
    /* 全角「！」的字形只占 em 框左侧约 1/3，右侧约 0.66em 是看不见的空白，
       会把标题的视觉中心整体拖左；用等量的负右外边距把这段空白收回，
       居中轴随之右移 0.33em，墨迹才真正落在屏幕中线上 */
    margin-right:-0.66em;
  }
  .hero h1:active{transform:scale(.97);}
  @keyframes heroSheen{
    0%  { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  @keyframes heroGlow{
    0%,100%{ filter:drop-shadow(0 6px 26px rgba(212,175,106,.26)); }
    50%    { filter:drop-shadow(0 8px 46px rgba(212,175,106,.55)) drop-shadow(0 0 70px rgba(255,225,160,.22)); }
  }

  /* 分隔线与落款脱离文档流、挂在标题下方：
     这样"居中"的是标题本身，而不是标题+分隔线+落款的整体 */
  .hero-rule{
    position:absolute;
    left:50%;top:100%;
    width:40px;height:1px;
    margin:28px 0 0;
    transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
    animation:ruleGlow 8s ease-in-out infinite;
  }
  @keyframes ruleGlow{
    0%,100%{ opacity:.55; width:40px; }
    50%    { opacity:1;   width:96px; }
  }

  .hero-sub{
    position:absolute;
    left:50%;top:100%;
    margin:53px 0 0;
    transform:translateX(-50%);
    white-space:nowrap;
    font-size:11px;
    font-weight:300;
    letter-spacing:.42em;
    text-indent:.42em;
    color:rgba(232,226,216,.4);
    line-height:2.2;
  }

  .zzz{
    position:absolute;
    top:6px;
    right:-4px;
    width:0;height:0;
    pointer-events:none;
  }
  .zzz i{
    position:absolute;
    font-style:normal;
    font-family:var(--serif);
    font-weight:500;
    color:rgba(212,175,106,.4);
    text-shadow:0 0 16px rgba(212,175,106,.4);
    animation:zzMove 6.6s ease-in-out infinite;
  }
  .zzz i:nth-child(1){font-size:13px;left:0;top:0;animation-delay:0s;}
  .zzz i:nth-child(2){font-size:18px;left:14px;top:-17px;animation-delay:1.4s;}
  .zzz i:nth-child(3){font-size:23px;left:34px;top:-40px;animation-delay:2.8s;}
  @keyframes zzMove{
    0%,100%{opacity:.06;transform:translateY(10px) rotate(-10deg) scale(.94);}
    50%    {opacity:.78;transform:translateY(-14px) rotate(8deg) scale(1.06);}
  }

  /* ---------- 许愿星图 ---------- */
  .wishmap{
    position:relative;
    padding:20px 0 40px;
  }

  .wishmap-stage{
    position:relative;
    width:100%;
    height:280px;
    margin:0 auto;
  }

  .wstar{
    position:absolute;
    width:22px;height:22px;
    margin:-11px 0 0 -11px;
    cursor:pointer;
    display:grid;place-items:center;
    z-index:5;
    -webkit-tap-highlight-color:transparent;
  }
  .wstar .ray{
    position:absolute;
    inset:-13px;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.4s var(--ease);
  }
  .wstar .ray::before,
  .wstar .ray::after{
    content:'';
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(90deg,transparent,rgba(255,246,220,.8),transparent);
  }
  .wstar .ray::before{ width:38px;height:1px; }
  .wstar .ray::after{
    width:1px;height:38px;
    background:linear-gradient(180deg,transparent,rgba(255,246,220,.8),transparent);
  }
  .wstar.on .ray{
    opacity:.9;
    animation:raySpin 14s linear infinite;
  }
  @keyframes raySpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .wstar::before{
    content:'';
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(212,175,106,.4),transparent 70%);
    opacity:0;
    transition:opacity .8s var(--ease);
  }
  .wstar::after{
    content:'';
    width:100%;height:100%;
    background:linear-gradient(180deg,#fff,#f4e4c1 45%,#d4af6a);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    opacity:.18;
    filter:drop-shadow(0 0 4px rgba(212,175,106,.5));
    transition:opacity .8s var(--ease),transform .8s var(--ease-back),filter .8s var(--ease);
  }

  .wstar.on::before{opacity:1;animation:starGlow 3.8s ease-in-out infinite;}
  .wstar.on::after{
    opacity:1;
    transform:scale(1.16);
    filter:drop-shadow(0 0 12px rgba(212,175,106,.95));
    animation:starBreath 3.8s ease-in-out infinite;
  }
  @keyframes starGlow{
    0%,100%{opacity:.45;transform:scale(1);}
    50%    {opacity:1;  transform:scale(1.5);}
  }
  @keyframes starBreath{
    0%,100%{ filter:drop-shadow(0 0 10px rgba(212,175,106,.8)); }
    50%    { filter:drop-shadow(0 0 20px rgba(255,236,190,1)); }
  }

  .wline{
    position:absolute;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(212,175,106,.45),transparent);
    transform-origin:0 50%;
    transform:rotate(var(--a,0deg)) scaleX(0);
    opacity:0;
    transition:opacity 1.2s var(--ease),transform 1.7s var(--ease-out);
    pointer-events:none;
    overflow:hidden;
  }
  .wline.show{
    opacity:1;
    transform:rotate(var(--a,0deg)) scaleX(1);
  }
  .wline::after{
    content:'';
    position:absolute;
    top:-1px;left:-30%;
    width:30%;height:3px;
    background:radial-gradient(closest-side,rgba(255,248,228,.95),rgba(212,175,106,.25) 70%,transparent);
    filter:blur(1.5px);
    animation:wlineSweep 5.2s var(--ease-soft) infinite;
  }
  @keyframes wlineSweep{
    0%  { left:-30%; opacity:0; }
    18% { opacity:1; }
    82% { opacity:1; }
    100%{ left:100%; opacity:0; }
  }

  .w18{
    position:absolute;
    left:50%;top:38%;
    transform:translate(-50%,-50%) scale(.5);
    font-family:var(--serif);
    font-size:56px;
    font-weight:500;
    letter-spacing:.12em;
    text-indent:.12em;
    background:linear-gradient(180deg,#fff,#f4e4c1 45%,#d4af6a);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 30px rgba(212,175,106,.8));
    opacity:0;
    transition:opacity 2s var(--ease-out),transform 2s var(--ease-out);
    pointer-events:none;
    z-index:3;
    white-space:nowrap;
  }
  .w18.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    animation:w18Glow 6.5s ease-in-out 1.6s infinite;
  }
  @keyframes w18Glow{
    0%,100%{ filter:drop-shadow(0 0 28px rgba(212,175,106,.75)); }
    50%    { filter:drop-shadow(0 0 60px rgba(255,230,170,1)) drop-shadow(0 0 110px rgba(212,175,106,.5)); }
  }

  .wphrase{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%) translateY(14px);
    font-family:var(--serif);
    font-size:13px;
    letter-spacing:.28em;
    text-indent:.28em;
    color:var(--gold-2);
    opacity:0;
    white-space:nowrap;
    pointer-events:none;
    transition:opacity 1.2s var(--ease),transform 1.2s var(--ease-out),letter-spacing 1.2s var(--ease);
    text-shadow:0 0 20px rgba(212,175,106,.5);
  }
  .wphrase.show{opacity:1;transform:translateX(-50%) translateY(0);letter-spacing:.34em;}

  /* ---------- 蜡烛 ---------- */
  .candles-sec{
    padding:40px 0 20px;
    text-align:center;
  }

  .candle-row{
    display:flex;
    gap:44px;
    justify-content:center;
    align-items:flex-end;
    height:120px;
    padding-top:40px;
  }

  .cd{
    position:relative;
    width:6px;
    height:54px;
    border-radius:3px;
    background:linear-gradient(180deg,#f4e4c1 0%,#d4af6a 40%,#8a6f3e 100%);
    box-shadow:0 0 12px rgba(212,175,106,.3),inset 0 0 4px rgba(255,255,255,.4);
    cursor:pointer;
    transition:opacity .9s var(--ease),transform .9s var(--ease);
  }

  .cd-flame{
    position:absolute;
    top:-26px;left:50%;
    width:11px;height:20px;
    margin-left:-5.5px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 76%,
      #fffef5 0%, #f4e4c1 22%, #d4af6a 50%, #b8893a 76%, rgba(184,137,58,0) 100%);
    box-shadow:
      0 0 18px 5px rgba(244,228,193,.5),
      0 0 40px 12px rgba(212,175,106,.25);
    animation:flameFlick 1.25s ease-in-out infinite alternate;
    transform-origin:50% 100%;
    transition:transform .8s var(--ease),opacity .8s var(--ease);
    pointer-events:none;
  }
  .cd-flame::before{
    content:'';
    position:absolute;
    left:50%;bottom:16%;
    width:56%;height:44%;
    transform:translateX(-50%);
    border-radius:50% 50% 46% 46% / 62% 62% 38% 38%;
    background:radial-gradient(circle at 50% 74%,#ffffff 0%,#fff6d6 55%,rgba(255,228,150,0) 100%);
    animation:flameCore 1.25s ease-in-out infinite alternate;
  }
  .cd-flame::after{
    content:'';
    position:absolute;
    left:50%;top:50%;
    width:260%;height:300%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,222,150,.28),transparent 62%);
    animation:flameHalo 3.4s ease-in-out infinite;
  }
  @keyframes flameFlick{
    0%  { transform:scale(1,1) translateY(0) rotate(0deg); }
    35% { transform:scale(1.06,.95) translateY(-1px) rotate(-1.6deg); }
    70% { transform:scale(.96,1.07) translateY(-2px) rotate(1.4deg); }
    100%{ transform:scale(1.04,.97) translateY(-1px) rotate(-.8deg); }
  }
  @keyframes flameCore{
    0%  { opacity:.75; transform:translateX(-50%) scale(.9); }
    100%{ opacity:1;   transform:translateX(-50%) scale(1.08); }
  }
  @keyframes flameHalo{
    0%,100%{ opacity:.5; transform:translate(-50%,-50%) scale(.9); }
    50%    { opacity:.95;transform:translate(-50%,-50%) scale(1.16); }
  }

  .cd-smoke{
    position:absolute;
    top:-18px;left:50%;
    width:7px;height:7px;
    margin-left:-3.5px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(232,226,216,.6),transparent 70%);
    opacity:0;pointer-events:none;
  }
  .cd-smoke::before,
  .cd-smoke::after{
    content:'';
    position:absolute;inset:0;
    border-radius:50%;
    background:radial-gradient(circle,rgba(232,226,216,.5),transparent 70%);
    opacity:0;
  }

  .cd.out .cd-flame{
    animation:none;
    transform:scale(.1);
    opacity:0;
  }
  .cd.out .cd-smoke{
    animation:smokeRise 4.8s ease-out forwards;
  }
  .cd.out .cd-smoke::before{ animation:smokeRise 4.8s ease-out .7s forwards; }
  .cd.out .cd-smoke::after { animation:smokeRise 4.8s ease-out 1.5s forwards; }
  @keyframes smokeRise{
    0%  {opacity:0;transform:translate(0,0) scale(.4);filter:blur(0);}
    18% {opacity:.75;}
    60% {opacity:.4;}
    100%{opacity:0;transform:translate(9px,-108px) scale(3.4);filter:blur(4px);}
  }

  .cd-msg{
    margin-top:32px;
    min-height:22px;
    font-family:var(--serif);
    font-size:12px;
    letter-spacing:.3em;
    text-indent:.3em;
    color:rgba(232,226,216,.45);
    transition:color 1s var(--ease),letter-spacing 1s var(--ease);
  }

  /* ---------- 签 ---------- */
  .fortune-sec{
    padding:60px 0 20px;
    text-align:center;
  }

  .fortune{
    position:relative;
    width:100%;
    max-width:300px;
    margin:0 auto;
    height:200px;
    perspective:1400px;
    cursor:pointer;
  }
  .fortune::after{
    content:'';
    position:absolute;
    inset:-26px;
    border-radius:26px;
    background:radial-gradient(circle,rgba(212,175,106,.16),transparent 68%);
    animation:fortuneGlow 8s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes fortuneGlow{
    0%,100%{ opacity:.4; transform:scale(.94); }
    50%    { opacity:.9; transform:scale(1.06); }
  }

  .ft-inner{
    position:relative;
    z-index:1;
    width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform 1.55s var(--ease-soft);
  }
  .fortune.flipped .ft-inner{transform:rotateY(180deg);}

  .ft-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:28px 22px;
    border-radius:14px;
    border:1px solid rgba(212,175,106,.22);
    background:linear-gradient(160deg,rgba(212,175,106,.06),rgba(212,175,106,.015));
    box-shadow:
      0 20px 50px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(244,228,193,.1);
    overflow:hidden;
  }

  .ft-front{
    background:
      linear-gradient(160deg,rgba(212,175,106,.08),rgba(212,175,106,.02)),
      repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(212,175,106,.03) 6px,rgba(212,175,106,.03) 7px);
  }
  .ft-front::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(112deg,
      transparent 32%, rgba(255,246,220,.16) 46%, transparent 62%);
    background-size:260% 100%;
    animation:cardShine 9s var(--ease-soft) infinite;
    pointer-events:none;
  }
  @keyframes cardShine{
    0%  { background-position:120% 50%; opacity:0; }
    22% { opacity:1; }
    70% { opacity:0; }
    100%{ background-position:-60% 50%; opacity:0; }
  }

  .ft-back{transform:rotateY(180deg);}

  .ft-mark{
    font-family:var(--serif);
    font-size:36px;
    color:var(--gold-dim);
    margin-bottom:14px;
    line-height:1;
    animation:markBreath 6s ease-in-out infinite;
  }
  @keyframes markBreath{
    0%,100%{ opacity:.8; transform:translateY(0); }
    50%    { opacity:1;  transform:translateY(-4px); }
  }

  .ft-label{
    font-family:var(--serif);
    font-size:10px;
    letter-spacing:.5em;
    text-indent:.5em;
    color:rgba(232,226,216,.35);
  }

  .ft-tag{
    display:inline-block;
    padding:3px 14px;
    margin-bottom:16px;
    border:1px solid rgba(212,175,106,.4);
    border-radius:2px;
    font-family:var(--serif);
    font-size:10px;
    letter-spacing:.4em;
    text-indent:.4em;
    color:var(--gold-2);
    animation:ftIn 1.4s var(--ease-out) both;
    animation-delay:.45s;
  }

  .ft-main{
    font-family:var(--serif);
    font-size:18px;
    font-weight:500;
    line-height:1.8;
    letter-spacing:.15em;
    text-indent:.15em;
    color:#fff;
    text-shadow:0 0 24px rgba(212,175,106,.4);
    animation:ftIn 1.4s var(--ease-out) both;
    animation-delay:.62s;
  }

  .ft-note{
    margin-top:16px;
    font-size:11.5px;
    font-weight:300;
    line-height:2;
    letter-spacing:.1em;
    color:rgba(232,226,216,.5);
    animation:ftIn 1.4s var(--ease-out) both;
    animation-delay:.8s;
  }
  @keyframes ftIn{
    0%  { opacity:0; transform:translateY(14px); filter:blur(8px); }
    100%{ opacity:1; transform:translateY(0);    filter:blur(0); }
  }

  /* ---------- 信 ---------- */
  .letter-sec{
    padding:70px 0 20px;
  }

  .letter{
    position:relative;
    padding-left:22px;
    font-family:var(--serif);
    font-size:14px;
    font-weight:400;
    line-height:2.4;
    letter-spacing:.12em;
    color:rgba(232,226,216,.78);
  }

  .letter::before{
    content:'';
    position:absolute;
    left:0;top:6px;bottom:6px;
    width:1px;
    background:linear-gradient(180deg,transparent,rgba(212,175,106,.4) 15%,rgba(212,175,106,.4) 85%,transparent);
    animation:inkBreath 9s ease-in-out infinite;
  }
  @keyframes inkBreath{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }

  .letter-hi{
    display:block;
    margin-bottom:22px;
    font-size:16px;
    font-weight:500;
    letter-spacing:.2em;
    color:var(--gold-2);
  }

  .letter p{
    margin-bottom:18px;
    opacity:0;
    transform:translateY(22px);
    filter:blur(9px);
    transition:opacity 1.9s var(--ease),transform 1.9s var(--ease-out),filter 1.9s var(--ease);
  }
  .letter p.in{opacity:1;transform:none;filter:blur(0);}
  .letter p:last-of-type{margin-bottom:0;}

  .letter-sign{
    display:block;
    margin-top:28px;
    text-align:right;
    font-size:11px;
    letter-spacing:.2em;
    color:rgba(232,226,216,.35);
  }

  /* ---------- 页脚 ---------- */
  .footer{
    padding:80px 0 10px;
    text-align:center;
    font-family:var(--serif);
    font-size:9.5px;
    letter-spacing:.55em;
    text-indent:.55em;
    color:rgba(212,175,106,.28);
    animation:footerBreath 10s ease-in-out infinite;
  }
  @keyframes footerBreath{
    0%,100%{ opacity:.7; letter-spacing:.55em; }
    50%    { opacity:1;  letter-spacing:.72em; }
  }

  /* ---------- 彩蛋 ---------- */
  .egg{
    position:fixed;inset:0;z-index:70;
    display:grid;place-items:center;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.6s var(--ease);
    padding:0 28px;
  }
  .egg.on{opacity:1;}

  .egg-text{
    font-family:var(--serif);
    font-size:clamp(22px,6.5vw,32px);
    font-weight:500;
    letter-spacing:.24em;
    text-indent:.24em;
    text-align:center;
    line-height:1.9;
    color:transparent;
    transform:scale(.86);
    transition:transform 1.9s var(--ease-out);
  }
  .egg.on .egg-text{transform:scale(1);}

  .egg-text span{
    display:inline-block;
    background-image:linear-gradient(180deg,#fff,#f4e4c1 45%,#d4af6a);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 30px rgba(212,175,106,.5));
    opacity:0;
    animation:eggChar 2.2s var(--ease-out) both;
  }
  @keyframes eggChar{
    0%  { opacity:0; transform:translateY(26px) scale(.82); filter:blur(14px); }
    45% { opacity:1; filter:blur(2px); }
    100%{ opacity:1; transform:translateY(0) scale(1); filter:blur(0) drop-shadow(0 0 34px rgba(255,230,170,.7)); }
  }

  /* ---------- 滚动浮现 ---------- */
  .reveal{
    opacity:0;
    transform:translateY(38px);
    filter:blur(6px);
    transition:opacity 1.9s var(--ease-out),transform 1.9s var(--ease-out),filter 1.9s var(--ease-out);
  }
  .reveal.in{opacity:1;transform:none;filter:blur(0);}

  /* ---------- 星瓶（右上角） ---------- */
  .vial{
    position:fixed;
    top:calc(20px + env(safe-area-inset-top));
    right:22px;
    z-index:40;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0;
    transform:translateY(-8px);
    transition:opacity 1.4s var(--ease) .9s,transform 1.4s var(--ease) .9s;
    pointer-events:none;
  }
  .vial.show{opacity:1;transform:none;}

  .vial svg{
    width:14px;height:14px;
    overflow:visible;
    filter:drop-shadow(0 0 6px rgba(212,175,106,.45));
  }
  .vial.ping svg{ animation:vialPing 1.5s var(--ease-back); }
  @keyframes vialPing{
    0%  { transform:scale(1) rotate(0deg); }
    35% { transform:scale(1.6) rotate(14deg); }
    65% { transform:scale(1.15) rotate(-8deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .vial-count{
    font-family:var(--serif);
    font-size:11px;
    letter-spacing:.14em;
    color:rgba(244,228,193,.6);
    font-variant-numeric:tabular-nums;
  }
  .vial-count b{color:var(--gold-2);font-weight:600;}

  @media (max-height:640px){
    .orb-wrap{transform:scale(.85);}
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="grain"></div>
<div class="aura" id="aura"></div>
<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>

<!-- ========== 开场 ========== -->
<div class="intro" id="intro">
  <div class="orb-wrap" id="orbWrap" role="button" tabindex="0" aria-label="轻触唤醒">
    <i class="orb-rays"></i>
    <span class="orb-ring"></span>
    <span class="orb-ring"></span>
    <span class="orb-ring"></span>
    <span class="orb-ring"></span>
    <span class="orb"></span>
  </div>
  <p class="intro-text">轻 触 唤 醒</p>
</div>

<!-- ========== 星瓶（右上） ========== -->
<div class="vial" id="vial">
  <svg viewBox="0 0 24 24" fill="none" stroke="#d4af6a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2h4v3l2 4v9a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3V9l2-4V2z"/>
    <path d="M8.5 13h7"/>
  </svg>
  <span class="vial-count"><b id="vialCount">0</b>/7</span>
</div>

<!-- ========== 主内容 ========== -->
<main class="main" id="main">
  <div class="wrap">

    <!-- Hero -->
    <header class="hero">
      <div class="hero-inner">
        <h1 id="heroName">生日快乐！</h1>
        <div class="hero-rule"></div>
        <p class="hero-sub">困困</p>

        <div class="zzz" aria-hidden="true">
          <i>z</i><i>Z</i><i>z</i>
        </div>
      </div>
    </header>

    <!-- 许愿星图 -->
    <section class="wishmap reveal">
      <span class="sec-label">七 个 祝 福</span>

      <div class="wishmap-stage" id="wishmapStage">
        <p class="wphrase" id="wphrase"></p>
      </div>
    </section>

    <!-- 蜡烛 -->
    <section class="candles-sec reveal">
      <span class="sec-label">许 愿</span>

      <div class="candle-row">
        <div class="cd"><i class="cd-flame"></i><span class="cd-smoke"></span></div>
        <div class="cd"><i class="cd-flame"></i><span class="cd-smoke"></span></div>
        <div class="cd"><i class="cd-flame"></i><span class="cd-smoke"></span></div>
      </div>

      <p class="cd-msg" id="cdMsg">轻 触 烛 火</p>
    </section>

    <!-- 签 -->
    <section class="fortune-sec reveal">
      <span class="sec-label">好 运 签</span>

      <div class="fortune" id="fortune">
        <div class="ft-inner">
          <div class="ft-face ft-front">
            <div class="ft-mark">簽</div>
            <div class="ft-label">轻 触 翻 开</div>
          </div>
          <div class="ft-face ft-back" id="ftBack"></div>

    <!-- 信 -->
    <section class="letter-sec reveal">
      <span class="sec-label">信</span>

      <div class="letter" id="letter">

        <p data-line>嘿嘿，现在是我在说话</p>
        <p data-line>没错，这是你的生日礼物————其中之一</p>
        <p data-line>猜猜后面会有什么呢</p>
        <p data-line>不开玩笑啦</p>
        <p data-line>生日快乐呀</p>
        <span class="letter-sign">—— 一方方</span>
      </div>
    </section>

    <p class="footer">困 困</p>
  </div>
</main>

<!-- 彩蛋 -->
<div class="egg" id="egg">
  <div class="egg-text" id="eggText"></div>
</div>

<script>
(function(){
  'use strict';

  /* =========================================================
     小工具
     ========================================================= */
  function rgba(hex, a){
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function rand(a, b){ return a + Math.random() * (b - a); }

  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =========================================================
     粒子系统（高级版）
     · 预渲染辉光精灵 + 加色混合
     · 拖尾光点 / 飘落纸屑 / 上升余烬
     · 冲击波涟漪 / 流星
     · 全部基于时间步长，慢速长时动画不掉帧
     ========================================================= */
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var bgStars = [];
  var parts = [];
  var waves = [];
  var meteors = [];

  var COLORS = ['#f4e4c1','#d4af6a','#e8b4a8','#b8a4d4','#ffffff','#a88a4e'];
  var GOLD_COLORS = ['#fff2c8','#ffd166','#ffc847','#ffe9a8','#ffffff'];

  var glowCache = {};
  function makeGlowSprite(color){
    var s = 64;
    var c = document.createElement('canvas');
    c.width = c.height = s;
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0,    'rgba(255,255,255,.95)');
    grad.addColorStop(0.16, rgba(color, .95));
    grad.addColorStop(0.42, rgba(color, .36));
    grad.addColorStop(1,    rgba(color, 0));
    g.fillStyle = grad;
    g.beginPath();
    g.arc(s / 2, s / 2, s / 2, 0, 6.2832);
    g.fill();
    return c;
  }
  function glowOf(color){
    if (!glowCache[color]) glowCache[color] = makeGlowSprite(color);
    return glowCache[color];
  }

  /* ---------- 尺寸 ---------- */
  var starsBuilt = false;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    /* 星星使用归一化坐标，缩放窗口时不会“跳位置” */
    if (!starsBuilt){ buildBgStars(); starsBuilt = true; }
    refreshOrbCenter();
  }

  function buildBgStars(){
    var n = Math.min(180, Math.round(W * H / 8200));
    for (var i = 0; i < n; i++){
      bgStars.push({
        nx: Math.random(),
        ny: Math.random(),
        r: Math.random() * 1.1 + 0.25,
        phase: Math.random() * Math.PI * 2,
        speed: rand(0.008, 0.03),
        warm: Math.random() < 0.35,
        big: Math.random() < 0.055
      });
    }
  }

  /* ---------- 生成粒子 ---------- */
  function spawn(count, x, y, opt){
    opt = opt || {};
    var fromTop = (x === undefined || y === undefined);
    var spread  = opt.spread || 44;
    var power   = opt.power  || 3.2;
    var palette = opt.gold ? GOLD_COLORS : COLORS;
    var mode    = opt.mode || (fromTop ? 'rain' : 'burst');
    var cap     = 700;

    for (var i = 0; i < count; i++){
      if (parts.length >= cap) break;

      var color = palette[(Math.random() * palette.length) | 0];
      var kind, roll = Math.random();

      if (mode === 'rain'){
        kind = roll < 0.60 ? 'confetti' : (roll < 0.84 ? 'ember' : 'spark');
      } else {
        kind = roll < 0.50 ? 'spark' : (roll < 0.82 ? 'confetti' : 'ember');
      }

      var p = {
        kind: kind,
        color: color,
        g: 0.075,
        drag: 0.985,
        tr: null,
        flutter: Math.random() * 6.283,
        fSpeed: 0,
        fAmp: 0,
        tw: Math.random() * 6.283,
        x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, w: 2, h: 2
      };

      if (kind === 'confetti'){
        p.w = rand(3, 8);
        p.h = rand(4.5, 11);
        p.rot = Math.random() * 6.283;
        p.vr = rand(-0.22, 0.22);
        p.g = rand(0.03, 0.07);
        p.drag = 0.992;
        p.fSpeed = rand(0.05, 0.12);
        p.fAmp = rand(0.3, 1.1);

        if (mode === 'rain'){
          p.x = rand(-20, W + 20);
          p.y = -30 - Math.random() * 300;
          p.vx = rand(-0.7, 0.7);
          p.vy = rand(0.5, 1.7);
          p.maxLife = rand(320, 620);
        } else {
          var a1 = Math.random() * 6.283, s1 = rand(1, power);
          p.x = x + rand(-spread, spread);
          p.y = y + rand(-spread, spread);
          p.vx = Math.cos(a1) * s1;
          p.vy = Math.sin(a1) * s1 - 1.1;
          p.maxLife = rand(170, 340);
        }
      } else if (kind === 'ember'){
        p.w = rand(1.6, 3.6);
        p.g = -0.012;
        p.drag = 0.99;
        p.tr = [];
        p.maxLife = rand(180, 320);

        if (mode === 'rain'){
          p.x = rand(0, W);
          p.y = H + rand(0, 160);
          p.vx = rand(-0.35, 0.35);
          p.vy = -rand(0.5, 1.6);
        } else {
          var a2 = Math.random() * 6.283, s2 = rand(0.6, power * 0.7);
          p.x = x + rand(-spread, spread);
          p.y = y + rand(-spread, spread);
          p.vx = Math.cos(a2) * s2;
          p.vy = Math.sin(a2) * s2 - 1.4;
        }
      } else {
        p.w = rand(1.4, 3.4);
        p.g = 0.09;
        p.drag = 0.965;
        p.tr = [];
        p.maxLife = rand(70, 160);

        if (mode === 'rain'){
          p.x = rand(0, W);
          p.y = -20 - Math.random() * 220;
          p.vx = rand(-0.8, 0.8);
          p.vy = rand(0.3, 1.2);
        } else {
          var a3 = Math.random() * 6.283, s3 = rand(1.2, power);
          p.x = x + rand(-spread, spread);
          p.y = y + rand(-spread, spread);
          p.vx = Math.cos(a3) * s3;
          p.vy = Math.sin(a3) * s3 - 1.3;
        }
      }

      p.life = p.maxLife;
      parts.push(p);
    }
  }

  /* ---------- 冲击波（speed 为负即为内吸收束的环） ---------- */
  function wave(x, y, opt){
    opt = opt || {};
    if (waves.length > 14) waves.shift();
    waves.push({
      x: x, y: y,
      r: opt.r0 || 6,
      vr: opt.speed || 7.5,
      decay: opt.decay || 0.014,
      width: opt.width || 1.6,
      color: opt.color || '#d4af6a',
      life: 1
    });
  }

  /* ---------- 光柱 ---------- */
  var beams = [];
  function beam(x, y, opt){
    opt = opt || {};
    if (beams.length > 4) beams.shift();
    beams.push({
      x: x, y: y,
      w: opt.w || rand(26, 56),
      h: 0,
      rise: opt.rise || rand(9, 15),
      life: 1,
      decay: opt.decay || 0.0072,
      color: opt.color || '#f4e4c1'
    });
  }

  /* ---------- 新增粒子基元 ---------- */
  function baseP(kind, color){
    return {
      kind: kind, color: color, g: 0, drag: 0.985, tr: null,
      flutter: Math.random() * 6.283, fSpeed: 0, fAmp: 0,
      tw: Math.random() * 6.283,
      x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, w: 2, h: 2,
      pull: 0, tx: 0, ty: 0
    };
  }

  /* 内吸：四面八方的光尘被吸进中心 */
  function implode(x, y, count, opt){
    opt = opt || {};
    var r0 = opt.r0 || 220;
    var palette = opt.gold ? GOLD_COLORS : COLORS;
    for (var i = 0; i < count; i++){
      if (parts.length >= 700) break;
      var p = baseP('dust', palette[(Math.random() * palette.length) | 0]);
      var a = Math.random() * 6.283;
      var rad = r0 * (0.5 + Math.random() * 0.6);
      p.x = x + Math.cos(a) * rad;
      p.y = y + Math.sin(a) * rad;
      var sp = rand(5, 12);
      p.vx = -Math.cos(a) * sp + rand(-1, 1);
      p.vy = -Math.sin(a) * sp + rand(-1, 1);
      p.tx = x; p.ty = y; p.pull = 0.05;
      p.w = rand(1.2, 3);
      p.drag = 0.972;
      p.tr = [];
      p.maxLife = rand(90, 150);
      p.life = p.maxLife;
      parts.push(p);
    }
  }

  /* 待机：缓缓飘向光球的光尘 */
  function dustToward(x, y){
    if (parts.length > 240) return;
    for (var i = 0; i < 2; i++){
      var p = baseP('dust', COLORS[(Math.random() * COLORS.length) | 0]);
      var a = Math.random() * 6.283;
      var rad = rand(170, 300);
      p.x = x + Math.cos(a) * rad;
      p.y = y + Math.sin(a) * rad;
      p.vx = -Math.cos(a) * rand(0.6, 1.8);
      p.vy = -Math.sin(a) * rand(0.6, 1.8);
      p.tx = x; p.ty = y; p.pull = 0.055;
      p.w = rand(1, 2.4);
      p.drag = 0.985;
      p.tr = [];
      p.maxLife = rand(150, 260);
      p.life = p.maxLife;
      parts.push(p);
    }
  }

  /* 流星光：向外飞散的拖尾光条 */
  function streaks(x, y, count){
    for (var i = 0; i < count; i++){
      if (parts.length >= 700) break;
      var p = baseP('streak', GOLD_COLORS[(Math.random() * GOLD_COLORS.length) | 0]);
      var a = Math.random() * 6.283;
      var sp = rand(5, 13);
      p.x = x; p.y = y;
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp;
      p.g = 0.02;
      p.drag = 0.94;
      p.w = rand(1, 2.4);
      p.maxLife = rand(38, 78);
      p.life = p.maxLife;
      parts.push(p);
    }
  }

  /* 星灯：缓缓升起、轻轻摇曳的暖光 */
  function lanterns(count){
    for (var i = 0; i < count; i++){
      if (parts.length >= 700) break;
      var p = baseP('lantern', GOLD_COLORS[(Math.random() * GOLD_COLORS.length) | 0]);
      p.x = rand(W * 0.08, W * 0.92);
      p.y = rand(H * 0.72, H + 90);
      p.vx = rand(-0.12, 0.12);
      p.vy = -rand(0.45, 1.05);
      p.g = -0.0035;
      p.drag = 0.999;
      p.fSpeed = rand(0.02, 0.045);
      p.fAmp = rand(0.1, 0.45);
      p.w = rand(4, 9);
      p.maxLife = rand(460, 820);
      p.life = p.maxLife;
      parts.push(p);
    }
  }

  /* ---------- 主循环 ---------- */
  var lastT = 0;
  var meteorTimer = 5000;

  function drawBg(dt){
    var sy = window.pageYOffset || document.documentElement.scrollTop || 0;
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < bgStars.length; i++){
      var s = bgStars[i];
      s.phase += s.speed * dt;
      var x = s.nx * W + Math.sin(s.phase * 0.6 + i) * 2.4;
      var y = ((s.ny * H - sy * 0.045) % H + H) % H;
      var tw = 0.5 + 0.5 * Math.sin(s.phase);
      var a = (s.big ? 0.42 : 0.20) * (0.25 + 0.75 * tw) + 0.06;

      ctx.globalAlpha = a;
      if (s.big){
        var sp = glowOf(s.warm ? '#f4e4c1' : '#ffffff');
        var sz = s.r * 16;
        ctx.drawImage(sp, x - sz / 2, y - sz / 2, sz, sz);
      } else {
        ctx.fillStyle = s.warm ? '#f4e4c1' : '#ffffff';
        ctx.beginPath();
        ctx.arc(x, y, s.r, 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawMeteors(dt){
    meteorTimer -= dt * 16.667;
    if (meteorTimer <= 0 && meteors.length < 2){
      meteorTimer = rand(7000, 16000);
      var fromLeft = Math.random() < 0.5;
      meteors.push({
        x: fromLeft ? rand(-120, W * 0.3) : rand(W * 0.7, W + 120),
        y: rand(-40, H * 0.35),
        vx: (fromLeft ? 1 : -1) * rand(6, 10),
        vy: rand(2.4, 4.2),
        len: rand(90, 200)
      });
    }

    if (!meteors.length) return;
    ctx.globalCompositeOperation = 'lighter';

    for (var i = meteors.length - 1; i >= 0; i--){
      var m = meteors[i];
      m.x += m.vx * dt;
      m.y += m.vy * dt;

      if (m.x < -300 || m.x > W + 300 || m.y > H + 200){
        meteors.splice(i, 1);
        continue;
      }

      var nl = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
      var tx = m.x - m.vx / nl * m.len;
      var ty = m.y - m.vy / nl * m.len;

      var g = ctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0,    'rgba(255,255,255,.95)');
      g.addColorStop(0.22, 'rgba(244,228,193,.55)');
      g.addColorStop(1,    'rgba(212,175,106,0)');

      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      var sp = glowOf('#ffffff'), sz = 28;
      ctx.globalAlpha = .9;
      ctx.drawImage(sp, m.x - sz / 2, m.y - sz / 2, sz, sz);
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawWaves(dt){
    if (!waves.length) return;
    ctx.globalCompositeOperation = 'lighter';

    for (var i = waves.length - 1; i >= 0; i--){
      var w = waves[i];
      w.r += w.vr * dt;
      w.life -= w.decay * dt;

      if (w.life <= 0){ waves.splice(i, 1); continue; }
      if (w.r < 1) continue;   /* 内收的环收拢到中心后不再绘制 */

      var a = w.life * w.life;

      ctx.globalAlpha = a * 0.3;
      ctx.strokeStyle = rgba(w.color, .55);
      ctx.lineWidth = w.width * 7;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r, 0, 6.2832);
      ctx.stroke();

      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = 'rgba(255,246,224,.9)';
      ctx.lineWidth = w.width;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r, 0, 6.2832);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawBeams(dt){
    if (!beams.length) return;
    ctx.globalCompositeOperation = 'lighter';

    for (var i = beams.length - 1; i >= 0; i--){
      var b = beams[i];
      b.h += b.rise * dt;
      if (b.h > H * 0.92) b.h = H * 0.92;
      b.life -= b.decay * dt;

      if (b.life <= 0){ beams.splice(i, 1); continue; }

      var a = b.life * b.life;
      var g = ctx.createLinearGradient(0, b.y, 0, b.y - b.h);
      g.addColorStop(0,    rgba(b.color, .5 * a));
      g.addColorStop(0.55, rgba(b.color, .16 * a));
      g.addColorStop(1,    rgba(b.color, 0));

      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      var w = b.w * (0.62 + 0.38 * Math.sin(b.life * 11));
      ctx.fillRect(b.x - w / 2, b.y - b.h, w, b.h + 4);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawParts(dt){
    if (!parts.length) return;
    var i, p, k;

    /* 1) 更新 + 淘汰 */
    for (i = parts.length - 1; i >= 0; i--){
      p = parts[i];
      p.vy += p.g * dt;
      p.vx *= Math.pow(p.drag, dt);
      p.vy *= Math.pow(p.drag, dt);

      /* 被中心吸引的光尘 */
      if (p.pull){
        var pdx = p.tx - p.x, pdy = p.ty - p.y;
        var pd = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
        if (pd < 8){
          p.life = Math.min(p.life, 5);
        } else {
          p.vx += pdx / pd * p.pull * dt;
          p.vy += pdy / pd * p.pull * dt;
        }
      }

      if (p.fAmp > 0){
        p.flutter += p.fSpeed * dt;
        p.x += (p.vx + Math.sin(p.flutter) * p.fAmp) * dt;
        p.y += p.vy * dt;
      } else {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      p.rot += p.vr * dt;
      p.life -= dt;

      if (p.tr){
        p.tr.unshift(p.x, p.y);
        if (p.tr.length > 12) p.tr.length = 12;
      }

      if (p.life <= 0 || p.y > H + 110 || p.x < -140 || p.x > W + 140 || p.y < -300){
        parts.splice(i, 1);
      }
    }

    /* 2) 纸屑（正常混合，边缘清晰） */
    ctx.globalCompositeOperation = 'source-over';
    for (i = 0; i < parts.length; i++){
      p = parts[i];
      if (p.kind !== 'confetti') continue;

      p.tw += 0.06 * dt;
      var ca = Math.min(1, p.life / (p.maxLife * 0.4)) * (0.72 + 0.28 * Math.abs(Math.cos(p.tw)));
      ctx.globalAlpha = ca;
      ctx.fillStyle = p.color;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 0.6)) + 0.6);
      ctx.restore();
    }

    /* 3) 光点与余烬（加色混合 + 拖尾） */
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    for (i = 0; i < parts.length; i++){
      p = parts[i];
      if (p.kind === 'confetti') continue;

      var a = Math.min(1, p.life / (p.maxLife * 0.45));

      /* 流星光：拉长的渐变拖尾 */
      if (p.kind === 'streak'){
        var spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy) || 1;
        var sl = Math.min(120, spd * 7);
        var ex = p.x - p.vx / spd * sl;
        var ey = p.y - p.vy / spd * sl;
        var lg = ctx.createLinearGradient(p.x, p.y, ex, ey);
        lg.addColorStop(0, rgba(p.color, .85 * a));
        lg.addColorStop(1, rgba(p.color, 0));
        ctx.globalAlpha = 1;
        ctx.strokeStyle = lg;
        ctx.lineWidth = p.w;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        continue;
      }

      /* 星灯：大团柔光 + 亮芯 */
      if (p.kind === 'lantern'){
        var lf = 0.8 + 0.2 * Math.sin(p.tw += 0.09 * dt);
        var sprite0 = glowOf(p.color);
        var lsz = p.w * 12 * lf;
        ctx.globalAlpha = a * 0.5 * lf;
        ctx.drawImage(sprite0, p.x - lsz / 2, p.y - lsz / 2, lsz, lsz);
        var core = p.w * 3.2 * lf;
        ctx.globalAlpha = a * (0.55 + 0.35 * lf);
        ctx.drawImage(sprite0, p.x - core / 2, p.y - core / 2, core, core);
        continue;
      }

      var flick = p.kind === 'ember'
        ? 0.72 + 0.28 * Math.sin(p.tw += 0.22 * dt)
        : 1;

      if (p.tr && p.tr.length >= 4){
        ctx.globalAlpha = a * 0.34 * flick;
        ctx.strokeStyle = rgba(p.color, .6);
        ctx.lineWidth = Math.max(0.6, p.w * 0.55);
        ctx.beginPath();
        ctx.moveTo(p.tr[0], p.tr[1]);
        for (k = 2; k < p.tr.length; k += 2) ctx.lineTo(p.tr[k], p.tr[k + 1]);
        ctx.stroke();
      }

      var sprite = glowOf(p.color);
      var sz = p.w * 8 * flick;
      ctx.globalAlpha = a * (0.82 + 0.18 * flick);
      ctx.drawImage(sprite, p.x - sz / 2, p.y - sz / 2, sz, sz);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function render(t){
    if (!lastT) lastT = t;
    var dt = (t - lastT) / 16.667;
    if (!(dt > 0)) dt = 1;
    if (dt > 3) dt = 3;
    lastT = t;

    ctx.clearRect(0, 0, W, H);
    drawBg(dt);
    drawMeteors(dt);
    drawWaves(dt);
    drawBeams(dt);
    drawParts(dt);

    requestAnimationFrame(render);
  }

  resize();
  requestAnimationFrame(render);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 240); });

  /* =========================================================
     指间柔光
     ========================================================= */
  var aura = document.getElementById('aura');
  var auraX = 0, auraY = 0, auraTX = 0, auraTY = 0, auraOn = false, auraStarted = false;

  function auraLoop(){
    auraX += (auraTX - auraX) * 0.085;
    auraY += (auraTY - auraY) * 0.085;
    aura.style.transform = 'translate3d(' + auraX + 'px,' + auraY + 'px,0)';
    requestAnimationFrame(auraLoop);
  }

  if (!reduceMotion){
    window.addEventListener('pointermove', function(e){
      auraTX = e.clientX;
      auraTY = e.clientY;
      if (!auraOn){
        auraOn = true;
        auraX = auraTX; auraY = auraTY;
        aura.classList.add('on');
      }
      if (!auraStarted){ auraStarted = true; requestAnimationFrame(auraLoop); }
    }, { passive: true });
  }

  /* =========================================================
     开场
     ========================================================= */
  var intro   = document.getElementById('intro');
  var orbWrap = document.getElementById('orbWrap');
  var main    = document.getElementById('main');
  var vial    = document.getElementById('vial');
  var flash   = document.getElementById('flash');
  var opened  = false;

  /* ---------- 开场新增：光球中心（供光尘汇聚使用） ---------- */
  var orbCenter = { x: 0, y: 0 };
  function refreshOrbCenter(){
    if (!orbWrap) return;
    var r = orbWrap.getBoundingClientRect();
    orbCenter.x = r.left + r.width / 2;
    orbCenter.y = r.top + r.height / 2;
  }

  /* ---------- 开场新增：环绕光球的两圈星点 ---------- */
  (function buildOrbits(){
    var orbEl = orbWrap.querySelector('.orb');
    function build(cls, n, radius, dur, reverse){
      var ring = document.createElement('span');
      ring.className = 'orb-orbit ' + cls;
      ring.style.animation = 'orbitSpin ' + dur + 's linear infinite' + (reverse ? ' reverse' : '');
      for (var i = 0; i < n; i++){
        var a = (i / n) * Math.PI * 2;
        var dot = document.createElement('i');
        dot.style.setProperty('--dx', (Math.cos(a) * radius).toFixed(2) + 'px');
        dot.style.setProperty('--dy', (Math.sin(a) * radius).toFixed(2) + 'px');
        dot.style.setProperty('--d', (i * 0.22).toFixed(2) + 's');
        dot.style.setProperty('--xd', (i * 0.045).toFixed(2) + 's');
        ring.appendChild(dot);
      }
      if (orbEl) orbWrap.insertBefore(ring, orbEl);
      else orbWrap.appendChild(ring);
    }
    build('a', 12, 46, 18, false);
    build('b', 8, 63, 27, true);
  })();

  /* ---------- 开场新增：待机时飘向光球的光尘 ---------- */
  var dustTimer = 0;
  function scheduleDust(){
    dustTimer = setTimeout(function(){
      if (opened) return;
      dustToward(orbCenter.x, orbCenter.y);
      scheduleDust();
    }, 190);
  }
  refreshOrbCenter();
  if (!reduceMotion) scheduleDust();

  function wake(){
    if (opened) return;
    opened = true;
    clearTimeout(dustTimer);
    orbWrap.classList.add('tapped');

    var r = orbWrap.getBoundingClientRect();

    setTimeout(function(){ wave(cx, cy, { r0: 200, speed: -6,   decay: 0.021, width: 0.9 }); }, 240);

    setTimeout(function(){ beam(cx - 52, cy + 6,  { w: 34, rise: 13, decay: 0.008 }); }, 1180);

  /* =========================================================
     滚动浮现
     ========================================================= */
  function initReveal(){
    var items = document.querySelectorAll('.reveal');
    var lines = document.querySelectorAll('[data-line]');

    if (!('IntersectionObserver' in window)){
      items.forEach(function(el){ el.classList.add('in'); });
      lines.forEach(function(el){ el.classList.add('in'); });
      return;
    }

    items.forEach(function(el, i){
      el.style.transitionDelay = Math.min(i * 260, 780) + 'ms';
    });

    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting){
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });

    items.forEach(function(el){ io.observe(el); });

    var lo = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting){
          var idx = Array.prototype.indexOf.call(lines, en.target);
          setTimeout(function(){ en.target.classList.add('in'); }, idx * 380);
          lo.unobserve(en.target);
        }
      });
    }, { threshold: 0.3 });

    lines.forEach(function(el){ lo.observe(el); });
  }

  /* =========================================================
     祝福星图
     ========================================================= */
  var stage = document.getElementById('wishmapStage');
  var wphrase = document.getElementById('wphrase');
  var vialCount = document.getElementById('vialCount');

  var STAR_POS = [
    { x: 12, y: 68 },
    { x: 24, y: 42 },
    { x: 38, y: 24 },
    { x: 50, y: 18 },
    { x: 62, y: 24 },
    { x: 76, y: 42 },
    { x: 88, y: 68 }
  ];

  var STAR_WORDS = [
    '愿 你 被 温 柔 以 待',
    '愿 你 眼 里 有 光',
    '愿 你 所 求 皆 如 愿',
    '愿 你 前 路 坦 荡',
    '愿 你 有 一 个 美 好 回 忆',
    '愿 你 永 远 有 勇 气',
    '愿 你 天 天 开 心'
  ];

  var litStars = 0;
  var allLit = false;

  STAR_POS.forEach(function(pos, i){
    var el = document.createElement('div');
    el.className = 'wstar';
    el.style.left = pos.x + '%';
    el.style.top  = pos.y + '%';

    /* 缓慢漂浮，每颗星节奏不同 */
    var dur = 7 + Math.random() * 5;
    var dx  = 2.5 + Math.random() * 3;
    var dy  = 2.5 + Math.random() * 3;
    el.style.animation = 'wfloat' + i + ' ' + dur + 's ease-in-out infinite';
    var style = document.createElement('style');
    style.textContent = '@keyframes wfloat' + i + '{' +
      '0%,100%{transform:translate(' + (-dx) + 'px,' + dy + 'px) scale(.98);}' +
      '50%{transform:translate(' + dx + 'px,' + (-dy) + 'px) scale(1.02);}' +
      '}';
    document.head.appendChild(style);

    /* 点亮后旋转的光芒十字 */
    var ray = document.createElement('i');
    ray.className = 'ray';
    el.appendChild(ray);

    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', '祝福 ' + (i + 1));

    el.addEventListener('click', function(){
      if (el.classList.contains('on')) return;
      el.classList.add('on');

      var r = el.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;

      spawn(34, cx, cy, { spread: 40, power: 3.8 });
      wave(cx, cy, { r0: 8, speed: 5.6, decay: 0.02, width: 1.2 });

      wphrase.textContent = STAR_WORDS[i];
      wphrase.classList.add('show');
      clearTimeout(wphrase._t);
      wphrase._t = setTimeout(function(){
        wphrase.classList.remove('show');
      }, 3400);

      litStars++;
      vialCount.textContent = litStars;

      vial.classList.remove('ping');
      void vial.offsetWidth;
      vial.classList.add('ping');

      if (litStars >= 7 && !allLit){
        allLit = true;
        setTimeout(drawConstellation, 900);
        setTimeout(triggerEgg, 4600);
      }
    });

    stage.appendChild(el);
  });

  function drawConstellation(){
    var sw = stage.clientWidth;
    var sh = stage.clientHeight;

    /* 线条逐段“生长”出来，光点沿线流过 */
    for (var i = 0; i < STAR_POS.length - 1; i++){
      var a = STAR_POS[i];
      var b = STAR_POS[i + 1];

      var ax = sw * a.x / 100;
      var ay = sh * a.y / 100;
      var bx = sw * b.x / 100;
      var by = sh * b.y / 100;

      var dx = bx - ax;
      var dy = by - ay;
      var len = Math.sqrt(dx * dx + dy * dy);
      var ang = Math.atan2(dy, dx) * 180 / Math.PI;

      var line = document.createElement('div');
      line.className = 'wline';
      line.style.left = ax + 'px';
      line.style.top  = ay + 'px';
      line.style.width = len + 'px';
      line.style.setProperty('--a', ang + 'deg');

      stage.appendChild(line);

      (function(line, i, mx, my){
        setTimeout(function(){
          line.classList.add('show');
          /* 线上缓缓亮起的星尘（换算成视口坐标，粒子才会落在线上） */
          setTimeout(function(){
            var rect = stage.getBoundingClientRect();
            spawn(10, rect.left + mx, rect.top + my, { spread: 26, power: 1.6 });
          }, 420);
        }, i * 240);
      })(line, i, (ax + bx) / 2, (ay + by) / 2);
    }

    setTimeout(function(){
      var num = document.createElement('div');
      num.className = 'w18';
      num.textContent = '18';
      stage.appendChild(num);

      requestAnimationFrame(function(){ num.classList.add('show'); });

      var cx = stage.clientWidth / 2;
      var cy = stage.clientHeight * 0.38;
      var rect = stage.getBoundingClientRect();
      var vx = rect.left + cx;
      var vy = rect.top + cy;

      spawn(90, vx, vy, { spread: 120, power: 6 });
      wave(vx, vy, { speed: 5.2, decay: 0.008, width: 1.4 });

      setTimeout(function(){
        spawn(60, vx, vy, { spread: 70, power: 4, gold: true });
      }, 520);

      /* 围绕“18”缓缓升起的光尘 */
      for (var k = 0; k < 5; k++){
        (function(k){
          setTimeout(function(){
            var r2 = stage.getBoundingClientRect();
            spawn(14,
              r2.left + stage.clientWidth * (0.2 + Math.random() * 0.6),
              r2.top + stage.clientHeight * (0.55 + Math.random() * 0.35),
              { spread: 20, power: 1.2, mode: 'burst' });
          }, k * 460);
        })(k);
      }
    }, 1800);
  }

  /* =========================================================
     蜡烛
     ========================================================= */
  var candles = Array.prototype.slice.call(document.querySelectorAll('.cd'));
  var cdMsg = document.getElementById('cdMsg');
  var allOut = false;

  candles.forEach(function(c){
    c.addEventListener('click', function(){
      if (c.classList.contains('out')) return;
      c.classList.add('out');

      var r = c.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top - 20;
      spawn(30, cx, cy, { spread: 30, power: 4.2 });
      wave(cx, cy, { r0: 5, speed: 4.6, decay: 0.024, width: 1 });

      checkCandles();
    });
  });

  function checkCandles(){
    var lit = candles.filter(function(c){ return !c.classList.contains('out'); });
    if (!lit.length && !allOut){
      allOut = true;
      cdMsg.textContent = '愿 望 已 寄 出';
      spawn(110);
      wave(W / 2, H * 0.42, { r0: 10, speed: 9, decay: 0.006, width: 1.6 });
      setTimeout(function(){
        spawn(70, W / 2, H * 0.42, { spread: 130, power: 5.5, gold: true });
      }, 320);
      setTimeout(function(){
        spawn(60, W / 2, H * 0.42, { spread: 160, power: 3.4, gold: true });
      }, 1100);
    } else if (lit.length){
      cdMsg.textContent = '还 剩 ' + lit.length + ' 盏';
    }
  }

  /* =========================================================
     签
     ========================================================= */
  var fortunes = [
    { tag:'上上签', main:'稳住，能赢',         note:'别慌，你远比想象中更厉害。' },
    { tag:'吉　签', main:'所愿皆成',           note:'十八岁许下的愿望，会被认真对待。' },
    { tag:'上上签', main:'未来可期',           note:'高考只是逗号，你的人生还长着呢。' },
    { tag:'大吉签', main:'星光不问赶路人',     note:'你走过的每一步，都算数。' },
  ];

  var fortune = document.getElementById('fortune');
  var ftBack  = document.getElementById('ftBack');
  var lastIdx = -1;
  var flipped = false;
  var ftBusy  = false;

  /* 修复：翻回背面后要等动画走完再抽新签，避免在半途被强行翻转 */
  fortune.addEventListener('click', function(){
    if (ftBusy) return;

    if (flipped){
      ftBusy = true;
      flipped = false;
      fortune.classList.remove('flipped');
      setTimeout(function(){
        drawFortune();
        setTimeout(function(){ ftBusy = false; }, 1650);
      }, 1650);
    } else {
      ftBusy = true;
      drawFortune();
      setTimeout(function(){ ftBusy = false; }, 1650);
    }
  });

  function drawFortune(){
    var i;
    do { i = (Math.random() * fortunes.length) | 0; }
    while (i === lastIdx && fortunes.length > 1);
    lastIdx = i;

    var f = fortunes[i];
    ftBack.innerHTML =
      '<div class="ft-tag">' + f.tag + '</div>' +
      '<div class="ft-main">「' + f.main + '」</div>' +
      '<div class="ft-note">' + f.note + '</div>';

    fortune.classList.add('flipped');
    flipped = true;

    setTimeout(function(){
      var r = fortune.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      spawn(44, cx, cy, { spread: 90, power: 3.6, gold: true });
      wave(cx, cy, { r0: 12, speed: 6, decay: 0.014, width: 1.2 });
    }, 800);
  }

  /* =========================================================
     彩蛋
     ========================================================= */
  var egg = document.getElementById('egg');
  var eggText = document.getElementById('eggText');
  var eggTriggered = false;

  function triggerEgg(){
    if (eggTriggered) return;
    eggTriggered = true;

    /* 逐字浮现，每个字都有自己的模糊与光晕 */
    var chars = '未 来 一 定 会 很 好'.split('');
    eggText.textContent = '';
    chars.forEach(function(ch, i){
      var span = document.createElement('span');
      span.textContent = (ch === ' ') ? '\u00a0' : ch;
      span.style.animationDelay = (i * 110) + 'ms';
      eggText.appendChild(span);
    });

    egg.classList.add('on');

    for (var i = 0; i < 10; i++){
      (function(i){
        setTimeout(function(){
          var x = W * (0.12 + Math.random() * 0.76);
          var y = H * (0.16 + Math.random() * 0.46);
          spawn(55, x, y, { spread: 70, power: 6.5 });
          if (i % 2 === 0) wave(x, y, { r0: 8, speed: 5.4, decay: 0.016, width: 1.1 });
        }, i * 340);
      })(i);
    }

    setTimeout(function(){ egg.classList.remove('on'); }, 8600);
    setTimeout(function(){
      /* 淡出后清空，避免下次重复叠加 */
      eggText.textContent = '';
    }, 10600);
  }

  /* =========================================================
     点按屏幕冒星光（排除可交互元素）
     ========================================================= */
  document.addEventListener('pointerdown', function(e){
    var t = e.target;
    if (!t || typeof t.closest !== 'function') return;

    if (t.closest('button') ||
        t.closest('.orb-wrap') ||
        t.closest('.wstar') ||
        t.closest('.cd') ||
        t.closest('.fortune') ||
        t.closest('#heroName') ||
        t.closest('.vial')){
      return;
    }

    spawn(9, e.clientX, e.clientY, { spread: 30, power: 2.6 });
    wave(e.clientX, e.clientY, { r0: 3, speed: 3.4, decay: 0.05, width: 0.8 });
  }, { passive: true });

  /* =========================================================
     标题连点小彩蛋
     ========================================================= */
  var heroName = document.getElementById('heroName');
  var tapCount = 0;
  var tapTimer = 0;

  heroName.addEventListener('click', function(){
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function(){ tapCount = 0; }, 1500);

    var r = heroName.getBoundingClientRect();
    var hx = r.left + r.width / 2;
    var hy = r.top + r.height / 2;
    spawn(10, hx, hy, { spread: 56, power: 2.6 });

    if (tapCount >= 5){
      tapCount = 0;
      wave(hx, hy, { r0: 10, speed: 7, decay: 0.012, width: 1.4 });
      for (var i = 0; i < 4; i++){
        (function(i){
          setTimeout(function(){
            spawn(50, W * (0.25 + Math.random() * 0.5), H * (0.25 + Math.random() * 0.35),
              { spread: 80, power: 6 });
          }, i * 260);
        })(i);
      }
      if (heroName.animate){
        heroName.animate(
          [{ transform:'scale(1)' },
           { transform:'scale(1.08)' },
           { transform:'scale(.99)' },
           { transform:'scale(1)' }],
          { duration: 1400, easing: 'cubic-bezier(.22,1,.36,1)' }
        );
      }
    }
  });

})();
</script>
</body>
</html>
